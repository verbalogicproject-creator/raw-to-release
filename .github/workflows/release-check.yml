name: Release preflight
on: workflow_dispatch
jobs:
  validate:
    # A configured self-hosted runner is required because public runners do not
    # include Codex's official plugin-creator validator. Absence fails closed.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:schemas
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run check:supply-chain -- --check
      - run: python scripts/sync_method.py --check
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/pocket-tasks/tests -v
      - run: python scripts/run_official_plugin_validator.py
